<script>
// Apply saved theme before first paint to avoid a flash of the wrong theme.
(function(){
  try {
    var t = localStorage.getItem('quebame_theme');
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch(e) {}
})();
</script>

<!-- PREMIUM INTERACTIVE HOME PAGE REDESIGN for QUEBAME -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

  :root {
    --bg-base: #09090b;
    --bg-surface: #18181b;
    --bg-surface-hover: #27272a;
    --text-primary: #ffffff;
    --text-secondary: #a1a1aa;
    --accent-color: #8b5cf6;
    --accent-hover: #7c3aed;
    --accent-gradient: linear-gradient(135deg, #8b5cf6, #ec4899);
    --border-color: rgba(255, 255, 255, 0.08);
    --radius-md: 12px;
    --radius-lg: 20px;
    --radius-pill: 9999px;
    --shadow-glow: 0 0 40px rgba(139, 92, 246, 0.2);
    --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* Reset & Base Setup */
  #home-page {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background-color: var(--bg-base);
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.08), transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.08), transparent 25%);
    color: var(--text-primary);
    font-family: var(--font-family);
    overflow: hidden;
    line-height: 1.5;
  }

  #home-page * { box-sizing: border-box; }

  /* Topbar */
  #home-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px;
    background: rgba(9, 9, 11, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    z-index: 100;
  }

  #home-logo {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #home-logo-mark {
    font-size: 1.4rem;
    -webkit-text-fill-color: #ec4899;
  }

  #home-topbar-actions {
    display: flex;
    gap: 12px;
  }

  .tb-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-pill);
    font-family: inherit;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .tb-btn:hover {
    background: var(--bg-surface);
    color: var(--text-primary);
    border-color: rgba(255, 255, 255, 0.2);
  }

  /* Scrollable Content */
  #home-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 60px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    perspective: 1000px;
    overflow-x: hidden;
  }

  #home-scroll::-webkit-scrollbar { width: 8px; }
  #home-scroll::-webkit-scrollbar-thumb {
    background: var(--bg-surface-hover);
    border-radius: 4px;
  }

  /* Hero Section */
  #home-hero {
    max-width: 800px;
    text-align: center;
    margin-bottom: 60px;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* --- 3D INTERACTIVE CUBE --- */
  #cube-container {
    width: 100px;
    height: 100px;
    margin: 0 auto 30px auto;
    perspective: 1000px;
    cursor: pointer; /* Suggests it's interactive */
  }

  #tracking-cube {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(0deg) rotateY(0deg);
    transition: transform 0.1s ease-out; 
  }

  .cube-face {
    position: absolute;
    width: 100px;
    height: 100px;
    border: 2px solid rgba(139, 92, 246, 0.5);
    background: rgba(24, 24, 27, 0.6);
    backdrop-filter: blur(4px);
    box-shadow: inset 0 0 20px rgba(236, 72, 153, 0.2), 0 0 15px rgba(139, 92, 246, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    transition: all 0.4s ease;
  }

  /* The inner dots */
  .cube-face::after {
    content: '';
    width: 20px;
    height: 20px;
    background: var(--accent-gradient);
    border-radius: 50%;
    opacity: 0.5;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform: scale(1);
  }

  /* --- CUTE MODE STYLES --- */
  .cute-face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    color: #ffffff;
    opacity: 0;
    transform: scale(0.2);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    text-shadow: 0 0 15px rgba(236, 72, 153, 1);
  }

  @keyframes blink {
    0%, 94%, 98%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.1); }
  }

  .cute-eye { display: inline-block; animation: blink 4s infinite; }

  /* When cute mode is activated via JS */
  #tracking-cube.cute-mode .cube-face {
    border-color: rgba(236, 72, 153, 0.9);
    box-shadow: inset 0 0 30px rgba(236, 72, 153, 0.4), 0 0 35px rgba(236, 72, 153, 0.5);
    background: rgba(236, 72, 153, 0.1);
  }
  
  #tracking-cube.cute-mode .cube-face::after {
    transform: scale(0); /* Hide dots */
    opacity: 0;
  }

  #tracking-cube.cute-mode .face-front .cute-face {
    opacity: 1; /* Show face */
    transform: scale(1);
  }

  /* Positioning Faces */
  .face-front  { transform: rotateY(  0deg) translateZ(50px); }
  .face-back   { transform: rotateY(180deg) translateZ(50px); }
  .face-right  { transform: rotateY( 90deg) translateZ(50px); }
  .face-left   { transform: rotateY(-90deg) translateZ(50px); }
  .face-top    { transform: rotateX( 90deg) translateZ(50px); }
  .face-bottom { transform: rotateX(-90deg) translateZ(50px); }

  /* Hero Typography */
  #home-hero h1 {
    font-size: 3.5rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin: 0 0 20px 0;
    line-height: 1.1;
    background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #home-hero p {
    font-size: 1.125rem;
    color: var(--text-secondary);
    margin: 0 auto 40px auto;
    max-width: 600px;
  }

  #home-hero-actions {
    display: flex;
    justify-content: center;
    gap: 16px;
  }

  /* Buttons */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 28px;
    border-radius: var(--radius-pill);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, opacity 0.2s ease;
  }

  .btn:active { transform: scale(0.97); }

  .btn.primary {
    background: var(--accent-gradient);
    color: #fff;
    box-shadow: var(--shadow-glow);
  }

  .btn.primary:hover {
    box-shadow: 0 0 60px rgba(236, 72, 153, 0.4);
    transform: translateY(-2px);
  }

  .btn:not(.primary) {
    background: var(--bg-surface);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
  }

  .btn:not(.primary):hover {
    background: var(--bg-surface-hover);
    transform: translateY(-2px);
  }

  /* Banners, Cards, Gallery */
  #restore-banner {
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.2);
    border-left: 4px solid #f59e0b;
    padding: 20px 24px;
    border-radius: var(--radius-md);
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 900px;
    width: 100%;
    margin-bottom: 40px;
    backdrop-filter: blur(10px);
  }

  #restore-banner-text strong { display: block; color: #fbbf24; font-size: 1.1rem; margin-bottom: 4px; }
  #restore-banner-sub { color: var(--text-secondary); font-size: 0.9rem; }
  #restore-banner-actions { display: flex; gap: 12px; }
  #restore-banner-actions .btn.primary { background: #f59e0b; box-shadow: none; padding: 8px 16px; font-size: 0.9rem; }
  #restore-banner-actions .btn:not(.primary) { padding: 8px 16px; font-size: 0.9rem; }

  #template-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    max-width: 900px;
    width: 100%;
    margin-bottom: 60px;
  }

  .template-card {
    background: linear-gradient(145deg, var(--bg-surface) 0%, rgba(24,24,27,0.4) 100%);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 24px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }

  .template-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 100%;
    background: var(--accent-gradient);
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 0;
  }

  .template-card:hover {
    transform: translateY(-4px);
    border-color: rgba(139, 92, 246, 0.4);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }

  .template-card:hover::before { opacity: 0.05; }
  .template-card > * { position: relative; z-index: 1; }

  .template-thumb {
    width: 56px;
    height: 56px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border-color);
  }

  .template-thumb-blank { color: #a1a1aa; }
  .template-thumb-rig { color: #3b82f6; }
  .template-thumb-lipsync { color: #ec4899; }

  .template-name { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
  .template-desc { font-size: 0.95rem; color: var(--text-secondary); }

  #gallery-header {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 12px;
  }

  #gallery-header h2 { font-size: 1.5rem; font-weight: 600; margin: 0; }
  #gallery-count { color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; }

  #project-gallery {
